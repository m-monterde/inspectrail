# Docker Compose — InspectRail Platform (base)
# Desarrollo: docker compose up
# Producción: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  # ── Base de datos ──
  database:
    image: timescale/timescaledb-ha:pg16
    container_name: inspectrail-db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-inspectrail}
      POSTGRES_USER: ${DB_USER:-inspectrail}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-inspectrail_dev}
    volumes:
      - db_data:/home/postgres/pgdata/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-inspectrail}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API GraphQL (Node.js) ──
  api:
    build:
      context: ../../services/api
      dockerfile: Dockerfile
    container_name: inspectrail-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-inspectrail}:${DB_PASSWORD:-inspectrail_dev}@database:5432/${DB_NAME:-inspectrail}
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_in_production}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      database:
        condition: service_healthy

  # ── Frontend (React) ──
  frontend:
    build:
      context: ../../services/frontend
      dockerfile: Dockerfile
    container_name: inspectrail-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  db_data:
